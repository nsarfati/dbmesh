services:
  prometheus:
    image: prom/prometheus:v3.5.1
    # The demo proxy runs on the host. Linux host networking avoids bridge/firewall
    # access to the host; Docker Desktop requires its host-networking option.
    network_mode: host
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=127.0.0.1:9090
  audit:
    image: postgres:17
    environment:
      POSTGRES_USER: dbmesh_audit
      POSTGRES_PASSWORD: dbmesh_audit
      POSTGRES_DB: dbmesh_audit
    ports:
      - "55435:5432"
    volumes:
      - audit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmesh_audit -d dbmesh_audit"]
      interval: 2s
      timeout: 2s
      retries: 30
  primary:
    image: postgres:17
    environment:
      POSTGRES_USER: dbmesh
      POSTGRES_PASSWORD: dbmesh
      POSTGRES_DB: demo
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - listen_addresses=*
    ports:
      - "55432:5432"
    volumes:
      - ./docker/postgres-primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmesh -d demo"]
      interval: 2s
      timeout: 2s
      retries: 30

  replica1:
    image: postgres:17
    depends_on:
      primary:
        condition: service_healthy
    environment:
      PGPASSWORD: dbmesh
    entrypoint: ["/replica-entrypoint.sh"]
    volumes:
      - ./docker/replica/entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "55433:5432"
    # Healthy once the base backup finished and the standby accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmesh -d demo"]
      interval: 2s
      timeout: 2s
      retries: 60

  replica2:
    image: postgres:17
    # Start after replica1: concurrent base backups make the primary recycle WAL
    # that the other one still needs, and one of them fails.
    depends_on:
      primary:
        condition: service_healthy
      replica1:
        condition: service_healthy
    environment:
      PGPASSWORD: dbmesh
    entrypoint: ["/replica-entrypoint.sh"]
    volumes:
      - ./docker/replica/entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmesh -d demo"]
      interval: 2s
      timeout: 2s
      retries: 60

volumes:
  prometheus-data:
  audit-data:
