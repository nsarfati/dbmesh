services:
  primary:
    image: postgres:17
    environment:
      POSTGRES_USER: routepg
      POSTGRES_PASSWORD: routepg
      POSTGRES_DB: demo
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - listen_addresses=*
    ports:
      - "55432:5432"
    volumes:
      - ./docker/postgres-primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routepg -d demo"]
      interval: 2s
      timeout: 2s
      retries: 30

  replica1:
    image: postgres:17
    depends_on:
      primary:
        condition: service_healthy
    environment:
      PGPASSWORD: routepg
    entrypoint: ["/replica-entrypoint.sh"]
    volumes:
      - ./docker/replica/entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "55433:5432"

  replica2:
    image: postgres:17
    depends_on:
      primary:
        condition: service_healthy
    environment:
      PGPASSWORD: routepg
    entrypoint: ["/replica-entrypoint.sh"]
    volumes:
      - ./docker/replica/entrypoint.sh:/replica-entrypoint.sh:ro
    ports:
      - "55434:5432"
